<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Jersey | Drip Nation</title>
    <meta name="description" content="Shop authentic retro jerseys at Drip Nation. Premium vintage football, basketball & athletic jerseys.">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
    <script src="assets/js/cart.js" defer></script>
</head>

<body>
    <!-- Breadcrumbs -->
    <nav class="dn-breadcrumbs">
        <a href="index.html">Home</a>
        <span class="separator">/</span>
        <a href="shop.html">Shop</a>
        <span class="separator">/</span>
        <span class="current">Retro Jersey</span>
    </nav>

    <!-- Category Hero Banner -->
    <div class="dn-category-hero">
        <div class="dn-category-hero-bg" style="background-image: url('assets/images/retro jerseys.jpeg');"></div>
        <div class="dn-category-hero-overlay"></div>
        <div class="dn-category-hero-content">
            <h1 class="dn-category-hero-title">RETRO JERSEY</h1>
            <p class="dn-category-hero-subtitle">AUTHENTIC VINTAGE · 30 PIECES</p>
        </div>
    </div>

    <!-- Filter Pills -->
    <div class="dn-filter-bar">
        <button class="dn-filter-pill active">All</button>
        <button class="dn-filter-pill">New</button>
        <button class="dn-filter-pill">Price ↑</button>
        <button class="dn-filter-pill">Price ↓</button>
        <button class="dn-filter-pill">Popular</button>
    </div>

    <!-- Product Grid -->
    <div class="dn-product-grid" id="productGrid"></div>

    <!-- Load More -->
    <div class="dn-load-more-wrap" id="loadMoreWrap">
        <button class="dn-load-more-btn" id="loadMoreBtn">LOAD MORE</button>
    </div>

    <script>
        const grid = document.getElementById('productGrid');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const loadMoreWrap = document.getElementById('loadMoreWrap');

        const productNames = [
            'Vintage Milan \'92', 'Classic Inter \'98', 'Retro Brazil \'70',
            'Heritage Arsenal \'04', 'Legend Madrid \'02', 'Golden Barça \'06',
            'Imperial Roma \'01', 'Thunder Juve \'96', 'Eclipse Ajax \'95',
            'Phantom PSG \'99', 'Dynasty Bayern \'01', 'Vortex Chelsea \'05',
            'Blaze Liverpool \'84', 'Storm Santos \'62', 'Titan Marseille \'93',
            'Prism Napoli \'87', 'Fusion Fiorentina \'98', 'Nova Benfica \'04',
            'Zenith Porto \'87', 'Mirage Dortmund \'97', 'Aero Lazio \'00',
            'Drift Parma \'99', 'Pulse Sampdoria \'91', 'Apex Celtic \'67',
            'Rush Rangers \'96', 'Luxe Spurs \'61', 'Ridge Everton \'85',
            'Core Leeds \'72', 'Echo Feyenoord \'70', 'Summit River \'96'
        ];

        const images = [
            'assets/images/i3 (1).jpeg',
            'assets/images/i3 (2).jpeg',
            'assets/images/i4.jpeg',
            'assets/images/i5.jpeg'
        ];

        let loadedCount = 0;
        const BATCH = 12;
        const TOTAL = 30;

        function loadProducts(count) {
            for (let i = 0; i < count && loadedCount < TOTAL; i++, loadedCount++) {
                const name = productNames[loadedCount];
                const price = Math.floor(Math.random() * (3500 - 999 + 1)) + 999;
                const img = images[loadedCount % images.length];

                const card = document.createElement('div');
                card.className = 'dn-product-card';
                card.onclick = () => window.location.href = 'product.html';
                card.innerHTML = `
                    <div class="dn-product-card-image" style="background-image: url('${img}');"></div>
                    <div class="dn-product-card-info">
                        <span class="dn-product-card-name">${name}</span>
                        <span class="dn-product-card-price">₹ ${price.toLocaleString('en-IN')}</span>
                    </div>
                    <div class="dn-product-card-actions">
                        <button class="dn-add-cart-btn" onclick="event.stopPropagation(); CartEngine.addItem('${name}', '${price}', '${img}')">+ ADD</button>
                    </div>
                `;
                grid.appendChild(card);
            }

            if (loadedCount >= TOTAL) {
                loadMoreWrap.style.display = 'none';
            }
        }

        loadProducts(BATCH);

        loadMoreBtn.addEventListener('click', () => {
            loadProducts(BATCH);
        });

        // Filter pill active state toggle (decorative)
        document.querySelectorAll('.dn-filter-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                document.querySelectorAll('.dn-filter-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
            });
        });
    </script>
</body>

</html>
