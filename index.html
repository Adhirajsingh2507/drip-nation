<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drip Nation | Premium Streetwear</title>
  <meta name="description"
    content="Born from the streets, refined for the culture. Explore premium retro jerseys, jackets, tracksuits & accessories at Drip Nation.">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/cart.js" defer></script>
  <script src="assets/js/vendor/supabase-js.min.js" defer></script>
  <script src="assets/js/supabase-client.js" defer></script>
  <script src="assets/js/store-bridge.js" defer></script>
</head>

<body>

  <!-- ── Hero Section (Editorial Photo Marquee) ── -->
  <section class="dn-hero" id="hero">
    <span class="dn-hero-accent dn-hero-accent--tl">Premium<br>Streetwear</span>
    <span class="dn-hero-accent dn-hero-accent--tr">Culture<br>Heritage</span>

    <h1 class="dn-hero-wordmark dn-hero-wordmark--left">DRIP</h1>

    <div class="dn-hero-marquee">
      <div class="dn-hero-marquee-track">
        <div class="dn-hero-photo dn-hero-photo--sm" style="--y:-30px; --rot:-4deg; background-image:url('assets/images/i3%20(1).jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--md" style="--y:25px; --rot:2.5deg; background-image:url('assets/images/retro%20jerseys.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--lg" style="--y:-10px; --rot:-1.5deg; background-image:url('assets/images/second%20page%20image.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--md" style="--y:-35px; --rot:3deg; background-image:url('assets/images/i5.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--sm" style="--y:30px; --rot:-2deg; background-image:url('assets/images/jackets.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--lg" style="--y:-20px; --rot:1.5deg; background-image:url('assets/images/i4.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--md" style="--y:35px; --rot:-3deg; background-image:url('assets/images/track%20and%20suit.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--sm" style="--y:-25px; --rot:2deg; background-image:url('assets/images/i6.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--sm" style="--y:-30px; --rot:-4deg; background-image:url('assets/images/i3%20(1).jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--md" style="--y:25px; --rot:2.5deg; background-image:url('assets/images/retro%20jerseys.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--lg" style="--y:-10px; --rot:-1.5deg; background-image:url('assets/images/second%20page%20image.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--md" style="--y:-35px; --rot:3deg; background-image:url('assets/images/i5.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--sm" style="--y:30px; --rot:-2deg; background-image:url('assets/images/jackets.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--lg" style="--y:-20px; --rot:1.5deg; background-image:url('assets/images/i4.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--md" style="--y:35px; --rot:-3deg; background-image:url('assets/images/track%20and%20suit.jpeg')"></div>
        <div class="dn-hero-photo dn-hero-photo--sm" style="--y:-25px; --rot:2deg; background-image:url('assets/images/i6.jpeg')"></div>
      </div>
    </div>

    <h1 class="dn-hero-wordmark dn-hero-wordmark--right">NATION</h1>

    <span class="dn-hero-accent dn-hero-accent--br">Born From<br>The Streets</span>
  </section>

  <!-- ── Featured Categories ── -->
  <section class="dn-featured-section dn-reveal">
    <div class="dn-section-head">
      <div>
        <span class="dn-section-label">Collection</span>
        <h2 class="dn-section-title">Explore the drop</h2>
      </div>
      <a href="shop.html" class="dn-section-link">View all</a>
    </div>
    <div class="dn-featured-grid dn-reveal-children" id="featured-categories">
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      const grid = document.getElementById('featured-categories');
      let categories = [], products = [];
      try {
        [categories, products] = await Promise.all([
          StoreBridge.getCategories(), StoreBridge.getProducts()
        ]);
      } catch (e) { console.error('[DripNation] index load failed', e); return; }

      grid.innerHTML = categories.map(function (cat) {
        var count = products.filter(function (p) {
          return p.category.toLowerCase() === cat.name.toLowerCase();
        }).length;

        return '<a href="category.html?slug=' + encodeURIComponent(cat.slug) +
          '&name=' + encodeURIComponent(cat.name) + '" class="dn-featured-card">' +
          '<div class="dn-featured-card-media">' +
            '<div class="dn-featured-card-bg" style="background-image: url(\'' + cat.image + '\');"></div>' +
          '</div>' +
          '<div class="dn-featured-card-foot">' +
            '<span class="dn-featured-card-label">' + cat.name + '</span>' +
            '<span class="dn-featured-card-count">' + count + '</span>' +
          '</div>' +
        '</a>';
      }).join('');

      grid.classList.add('visible');
      var sec = document.querySelector('.dn-featured-section');
      if (sec) sec.classList.add('visible');
    });
  </script>

</body>

</html>
