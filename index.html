<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drip Nation | Premium Streetwear</title>
  <meta name="description"
    content="Born from the streets, refined for the culture. Explore premium retro jerseys, jackets, tracksuits & accessories at Drip Nation.">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/cart.js" defer></script>
  <script src="assets/js/store-bridge.js" defer></script>
  <script src="assets/js/script.js" defer></script>
</head>

<body>

  <!-- ── Hero Section ── -->
  <div class="hero-container" id="hero">
    <div class="layer layer-base">
      <div class="full-img img2 base-left"></div>
      <div class="full-img img1 base-right"></div>
    </div>
    <div class="layer layer-spotlight" id="spotlight-layer">
      <div class="full-img img1 spot-left depth-effect"></div>
      <div class="full-img img2 spot-right depth-effect"></div>
    </div>
    <div class="top-boundary-line"></div>
    <div class="hero-content pointer-events-none">
      <h1 class="hero-title" id="hero-title">THE DRIP NATION</h1>
      <p class="hero-subtitle" id="hero-subtitle">Tap & Hold the Border</p>
    </div>
    <div class="bottom-boundary-line"></div>
  </div>

  <!-- SVG Mask -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;" aria-hidden="true">
    <defs>
      <filter id="waterEdge">
        <feGaussianBlur stdDeviation="20" result="blur" />
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.008" numOctaves="2" result="noise" />
        <feDisplacementMap id="disp" in="blur" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <mask id="waterMask" maskUnits="userSpaceOnUse">
        <circle id="maskCircle" cx="-500" cy="-500" r="100" fill="white" filter="url(#waterEdge)" />
      </mask>
    </defs>
  </svg>

  <!-- ── Featured Categories (Dynamic from Admin) ── -->
  <section class="dn-featured-section dn-reveal">
    <span class="dn-section-label">[ COLLECTION ]</span>
    <h2 class="dn-section-title">EXPLORE THE DROP</h2>
    <div class="dn-featured-grid dn-reveal-children" id="featured-categories">
      <!-- Rendered by JS -->
    </div>
  </section>

  <!-- ── Marquee Ticker (Dynamic from Admin CMS) ── -->
  <div class="dn-marquee-wrap">
    <div class="dn-marquee-track" id="marquee-track">
      <!-- Rendered by JS -->
    </div>
  </div>

  <!-- ── Brand Statement ── -->
  <section class="dn-brand-statement dn-reveal">
    <p class="dn-brand-statement-line1" id="brand-quote">"Where athletic heritage meets<br>the culture of tomorrow."</p>
    <p class="dn-brand-statement-line2">DRIP NATION</p>
    <div class="dn-brand-rule"></div>
    <a href="shop.html" class="dn-explore-cta">EXPLORE</a>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // ── Render Dynamic Categories ──
      const categories = StoreBridge.getCategories();
      const grid = document.getElementById('featured-categories');

      if (categories.length > 0) {
        grid.innerHTML = categories.map(cat => `
          <a href="category.html?slug=${encodeURIComponent(cat.slug)}&name=${encodeURIComponent(cat.name)}" class="dn-featured-card">
            <div class="dn-featured-card-bg" style="background-image: url('${cat.image}');"></div>
            <div class="dn-featured-card-overlay"></div>
            <span class="dn-featured-card-label">${cat.name.toUpperCase()}</span>
            <span class="dn-featured-card-arrow">↗</span>
          </a>
        `).join('');
      }

      // ── Render Marquee Ticker ──
      const marqueeTrack = document.getElementById('marquee-track');
      const tickerItems = ['NEW ARRIVALS', 'RETRO JERSEYS', 'PREMIUM STREETWEAR', 'LIMITED DROPS', 'DRIP NATION 2026'];
      let tickerHTML = '';
      // Double for seamless loop
      for (let loop = 0; loop < 2; loop++) {
        tickerItems.forEach(item => {
          tickerHTML += `<span class="dn-marquee-item">${item}</span><span class="dn-marquee-separator">◆</span>`;
        });
      }
      marqueeTrack.innerHTML = tickerHTML;
    });
  </script>

</body>

</html>
