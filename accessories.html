<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories | Drip Nation</title>
    <meta name="description" content="Shop premium streetwear accessories at Drip Nation. Chains, caps, bags, watches & more.">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
    <script src="assets/js/cart.js" defer></script>
</head>

<body>
    <!-- Breadcrumbs -->
    <nav class="dn-breadcrumbs">
        <a href="index.html">Home</a>
        <span class="separator">/</span>
        <a href="shop.html">Shop</a>
        <span class="separator">/</span>
        <span class="current">Accessories</span>
    </nav>

    <!-- Category Hero Banner -->
    <div class="dn-category-hero">
        <div class="dn-category-hero-bg" style="background-image: url('assets/images/accessories.jpeg');"></div>
        <div class="dn-category-hero-overlay"></div>
        <div class="dn-category-hero-content">
            <h1 class="dn-category-hero-title">ACCESSORIES</h1>
            <p class="dn-category-hero-subtitle">COMPLETE THE FIT · 30 PIECES</p>
        </div>
    </div>

    <!-- Filter Pills -->
    <div class="dn-filter-bar">
        <button class="dn-filter-pill active">All</button>
        <button class="dn-filter-pill">New</button>
        <button class="dn-filter-pill">Price ↑</button>
        <button class="dn-filter-pill">Price ↓</button>
        <button class="dn-filter-pill">Popular</button>
    </div>

    <!-- Product Grid -->
    <div class="dn-product-grid" id="productGrid"></div>

    <!-- Load More -->
    <div class="dn-load-more-wrap" id="loadMoreWrap">
        <button class="dn-load-more-btn" id="loadMoreBtn">LOAD MORE</button>
    </div>

    <script>
        const grid = document.getElementById('productGrid');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const loadMoreWrap = document.getElementById('loadMoreWrap');

        const productNames = [
            'Shadow Chain', 'Midnight Beanie', 'Carbon Crossbody',
            'Phantom Cap', 'Onyx Wristband', 'Steel Dog Tag',
            'Noir Bucket Hat', 'Obsidian Ring', 'Venom Snapback',
            'Eclipse Durag', 'Blaze Lanyard', 'Iron Pendant',
            'Drift Armband', 'Haze Headband', 'Core Keychain',
            'Stealth Balaclava', 'Apex Sunglasses', 'Titan Belt',
            'Storm Watch', 'Frost Earring Set', 'Ridge Wallet',
            'Nova Backpack', 'Pulse Socks Pack', 'Zenith Scarf',
            'Prism Beads', 'Mirage Bandana', 'Thunder Wrist Cuff',
            'Fusion Pin Set', 'Rush Phone Case', 'Luxe Tote'
        ];

        const images = [
            'assets/images/accessories.jpeg',
            'assets/images/i6.jpeg',
            'assets/images/WhatsApp Image 2026-07-06 at 15.58.23.jpeg',
            'assets/images/second page image.jpeg'
        ];

        let loadedCount = 0;
        const BATCH = 12;
        const TOTAL = 30;

        function loadProducts(count) {
            for (let i = 0; i < count && loadedCount < TOTAL; i++, loadedCount++) {
                const name = productNames[loadedCount];
                const price = Math.floor(Math.random() * (2500 - 299 + 1)) + 299;
                const img = images[loadedCount % images.length];

                const card = document.createElement('div');
                card.className = 'dn-product-card';
                card.onclick = () => window.location.href = 'product.html';
                card.innerHTML = `
                    <div class="dn-product-card-image" style="background-image: url('${img}');"></div>
                    <div class="dn-product-card-info">
                        <span class="dn-product-card-name">${name}</span>
                        <span class="dn-product-card-price">₹ ${price.toLocaleString('en-IN')}</span>
                    </div>
                    <div class="dn-product-card-actions">
                        <button class="dn-add-cart-btn" onclick="event.stopPropagation(); CartEngine.addItem('${name}', '${price}', '${img}')">+ ADD</button>
                    </div>
                `;
                grid.appendChild(card);
            }

            if (loadedCount >= TOTAL) {
                loadMoreWrap.style.display = 'none';
            }
        }

        loadProducts(BATCH);

        loadMoreBtn.addEventListener('click', () => {
            loadProducts(BATCH);
        });

        document.querySelectorAll('.dn-filter-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                document.querySelectorAll('.dn-filter-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
            });
        });
    </script>
</body>

</html>
