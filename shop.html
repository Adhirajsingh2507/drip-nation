<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Drip Nation</title>
    <meta name="description" content="Browse all Drip Nation categories — dynamically managed from the admin panel.">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/cart.js" defer></script>
    <script src="assets/js/vendor/supabase-js.min.js" defer></script>
    <script src="assets/js/supabase-client.js" defer></script>
    <script src="assets/js/store-bridge.js" defer></script>
    <style>
        .shop-grid {
            width: 100%; max-width: var(--maxw); margin: 0 auto;
            display: flex; flex-direction: column;
            border-top: 1px solid var(--rule);
            padding: 0 var(--gutter) 100px var(--gutter);
        }
        .shop-card {
            position: relative; display: grid;
            grid-template-columns: 84px 1fr auto auto;
            align-items: center; gap: 40px;
            padding: 26px 0; border-bottom: 1px solid var(--rule);
            transition: opacity var(--transition-ease);
        }
        .shop-card-bg {
            width: 84px; height: 108px;
            background-size: cover; background-position: center;
            background-color: var(--grey-100);
            transition: opacity 0.5s var(--ease);
        }
        .shop-card:hover .shop-card-bg { opacity: 0.8; }
        .shop-card-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 3.4vw, 2.75rem); font-weight: 400;
            letter-spacing: -0.015em; text-transform: uppercase;
            color: var(--black); line-height: 1;
        }
        .shop-card-desc {
            font-size: 0.6875rem; font-weight: 400; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--text-muted);
            text-align: right; max-width: 260px;
        }
        .shop-card-count {
            font-size: 0.625rem; font-weight: 400; letter-spacing: 0.16em;
            text-transform: uppercase; color: var(--text-dim);
            white-space: nowrap; min-width: 72px; text-align: right;
        }
        @media (max-width: 900px) {
            .shop-card { grid-template-columns: 64px 1fr auto; gap: 20px; padding: 20px 0; }
            .shop-card-bg { width: 64px; height: 84px; }
            .shop-card-desc { display: none; }
            .shop-card-count { min-width: 0; font-size: 0.5625rem; }
        }
    </style>
</head>

<body>
    <nav class="dn-breadcrumbs">
        <a href="index.html">Home</a>
        <span class="separator">/</span>
        <span class="current">Shop</span>
    </nav>

    <header class="dn-page-head">
        <h1 class="dn-page-title">Categories</h1>
        <p class="dn-page-sub" id="cat-count-label">Select a collection</p>
    </header>

    <div class="shop-grid" id="shop-grid">
        <!-- Rendered by JS -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const grid = document.getElementById('shop-grid');
            const label = document.getElementById('cat-count-label');
            label.textContent = 'Loading…';

            let categories = [], products = [];
            try {
                [categories, products] = await Promise.all([
                    StoreBridge.getCategories(),
                    StoreBridge.getProducts()
                ]);
            } catch (e) {
                console.error('[DripNation] shop load failed', e);
                label.textContent = 'Could not load';
                grid.innerHTML = '<p style="color:var(--text-muted);padding:40px 0;">Could not load collections. Please refresh.</p>';
                return;
            }

            label.textContent = categories.length + ' Collections';

            grid.innerHTML = categories.map(cat => {
                const count = products.filter(p => p.category.toLowerCase() === cat.name.toLowerCase()).length;
                return `
                    <a href="category.html?slug=${encodeURIComponent(cat.slug)}&name=${encodeURIComponent(cat.name)}" class="shop-card dn-reveal">
                        <div class="shop-card-bg" style="background-image: url('${cat.image}');"></div>
                        <span class="shop-card-title">${cat.name}</span>
                        <span class="shop-card-desc">${(cat.desc || '').replace(/\.\s*$/, '')}</span>
                        <span class="shop-card-count">${count} Pieces</span>
                    </a>
                `;
            }).join('');

            // async-rendered cards → reveal directly (observer already ran)
            grid.querySelectorAll('.dn-reveal').forEach(el => el.classList.add('visible'));
        });
    </script>
</body>

</html>
