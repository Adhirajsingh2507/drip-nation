<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag | Drip Nation</title>
    <meta name="description" content="Review your bag at Drip Nation.">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/cart.js" defer></script>
    <script src="assets/js/vendor/supabase-js.min.js" defer></script>
    <script src="assets/js/supabase-client.js" defer></script>
    <script src="assets/js/store-bridge.js" defer></script>
    <style>
        .cart-layout {
            max-width: var(--maxw); margin: 0 auto;
            padding: 0 var(--gutter) 100px var(--gutter);
            display: grid; grid-template-columns: 1.6fr 1fr; gap: 80px;
            align-items: start;
        }
        .cart-main { display: flex; flex-direction: column; }
        .cart-items { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
        .cart-item {
            display: grid; grid-template-columns: 90px 1fr auto; align-items: flex-start;
            gap: 28px; padding: 28px 0; border-bottom: 1px solid var(--rule);
        }
        .cart-item-img {
            width: 90px; height: 120px; background-size: cover; background-position: center;
            background-color: var(--grey-100);
        }
        .cart-item-details { display: flex; flex-direction: column; gap: 7px; }
        .cart-item-name {
            font-size: 0.875rem; font-weight: 400; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--black);
        }
        .cart-item-meta {
            font-size: 0.625rem; font-weight: 400; letter-spacing: 0.16em;
            text-transform: uppercase; color: var(--text-muted);
        }
        .cart-item-qty-row { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
        .qty-btn {
            width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
            background: transparent; border: 1px solid var(--rule);
            color: var(--black); font-size: 0.8rem; line-height: 1;
            transition: border-color var(--transition-ease), background var(--transition-ease), color var(--transition-ease);
        }
        .qty-btn:hover { background: var(--black); border-color: var(--black); color: var(--white); }
        .qty-value { font-size: 0.75rem; font-weight: 400; letter-spacing: 0.1em; min-width: 16px; text-align: center; }
        .cart-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
        .cart-item-price { font-size: 0.875rem; font-weight: 400; letter-spacing: 0.04em; }
        .cart-remove-btn {
            color: var(--text-muted); font-size: 0.5625rem; letter-spacing: 0.2em;
            text-transform: uppercase; transition: color var(--transition-ease);
            padding: 0; border-bottom: 1px solid transparent;
        }
        .cart-remove-btn:hover { color: var(--black); border-bottom-color: var(--black); }

        .empty-cart { padding: 80px 0; text-align: center; border-bottom: 1px solid var(--rule); }
        .empty-cart-msg {
            font-family: var(--font-display); font-size: 1.25rem; font-weight: 400;
            letter-spacing: 0.12em; color: var(--text-muted);
            margin-bottom: 28px; text-transform: uppercase;
        }
        .continue-shopping-link {
            font-size: 0.6875rem; font-weight: 400; letter-spacing: 0.22em; text-transform: uppercase;
            color: var(--black); border: 1px solid var(--black); padding: 16px 44px;
            display: inline-block; transition: background var(--transition-ease), color var(--transition-ease);
        }
        .continue-shopping-link:hover { background: var(--black); color: var(--white); }

        /* Order Summary */
        .order-summary {
            position: sticky; top: calc(var(--nav-h) + 32px); align-self: start;
            border-top: 1px solid var(--black); padding-top: 24px;
        }
        .summary-title {
            font-size: 0.5625rem; font-weight: 400; letter-spacing: 0.32em;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 28px;
        }
        .summary-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
        .summary-label { font-size: 0.75rem; font-weight: 400; color: var(--text-muted); letter-spacing: 0.04em; }
        .summary-value { font-size: 0.75rem; font-weight: 400; letter-spacing: 0.04em; }
        .summary-divider { height: 1px; background: var(--rule); margin: 24px 0; }
        .summary-total-label {
            font-size: 0.625rem; font-weight: 400; letter-spacing: 0.24em;
            text-transform: uppercase; color: var(--black);
        }
        .summary-total-value { font-size: 1.375rem; font-weight: 400; letter-spacing: -0.01em; }

        /* Promo */
        .promo-section { margin-top: 28px; border-top: 1px solid var(--rule); padding-top: 24px; }
        .promo-row { display: flex; }
        .promo-input {
            flex: 1; min-width: 0; background: transparent; border: none;
            border-bottom: 1px solid var(--rule);
            color: var(--black); padding: 10px 0; font-family: var(--font-body);
            font-size: 0.6875rem; letter-spacing: 0.16em; text-transform: uppercase;
        }
        .promo-input::placeholder { color: var(--text-dim); }
        .promo-input:focus { outline: none; border-bottom-color: var(--black); }
        .promo-apply-btn {
            background: transparent; color: var(--black);
            border: none; border-bottom: 1px solid var(--rule);
            padding: 10px 0 10px 20px; font-size: 0.5625rem; font-weight: 400;
            letter-spacing: 0.22em; text-transform: uppercase;
            transition: border-color var(--transition-ease), opacity var(--transition-ease);
        }
        .promo-apply-btn:hover { border-bottom-color: var(--black); opacity: 0.6; }
        .promo-msg { font-size: 0.625rem; margin-top: 10px; letter-spacing: 0.08em; }
        .promo-msg.error { color: var(--text-muted); }
        .promo-applied {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 12px; padding: 10px 0; border-bottom: 1px solid var(--black);
        }
        .promo-applied-label {
            font-size: 0.625rem; font-weight: 400; color: var(--black);
            letter-spacing: 0.16em; text-transform: uppercase;
        }
        .promo-remove {
            color: var(--text-muted); font-size: 0.5625rem;
            letter-spacing: 0.18em; text-transform: uppercase;
            transition: color var(--transition-ease);
        }
        .promo-remove:hover { color: var(--black); }

        .checkout-btn {
            width: 100%; padding: 18px; background: var(--black); color: var(--white);
            border: 1px solid var(--black); font-size: 0.6875rem; font-weight: 400;
            letter-spacing: 0.24em; text-transform: uppercase; margin-top: 32px;
            transition: background var(--transition-ease), color var(--transition-ease);
        }
        .checkout-btn:hover { background: var(--white); color: var(--black); }
        .continue-btn {
            width: 100%; padding: 16px; background: transparent; color: var(--black);
            border: 1px solid var(--rule); font-size: 0.625rem; font-weight: 400;
            letter-spacing: 0.22em; text-transform: uppercase;
            transition: border-color var(--transition-ease);
            margin-top: 10px; text-align: center; display: block;
        }
        .continue-btn:hover { border-color: var(--black); }

        @media (max-width: 900px) {
            .cart-layout { grid-template-columns: 1fr; gap: 48px; }
            .cart-item { grid-template-columns: 70px 1fr; gap: 18px; }
            .cart-item-right { grid-column: 2; flex-direction: row; align-items: center; justify-content: space-between; }
            .cart-item-img { width: 70px; height: 94px; grid-row: span 2; }
            .order-summary { position: static; }
        }

        /* Checkout modal (light editorial theme) */
        .co-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: flex-start; justify-content: center; z-index: 600; padding: 6vh 20px; overflow-y: auto; }
        .co-modal-overlay.open { display: flex; }
        .co-modal { width: 100%; max-width: 440px; background: var(--white); border: 1px solid var(--black); }
        .co-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 22px 26px; border-bottom: 1px solid var(--rule); font-size: 0.6875rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--black); }
        .co-close { background: none; border: none; color: var(--black); font-size: 1.4rem; cursor: pointer; line-height: 1; }
        .co-form { padding: 26px; display: flex; flex-direction: column; gap: 14px; }
        .co-form input { background: transparent; border: none; border-bottom: 1px solid var(--rule); color: var(--black); padding: 11px 0; font-family: var(--font-body); font-size: 0.8125rem; letter-spacing: 0.04em; }
        .co-form input::placeholder { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.6875rem; }
        .co-form input:focus { outline: none; border-bottom-color: var(--black); }
        .co-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        @media (max-width: 480px) { .co-row { grid-template-columns: 1fr; } }
    </style>
</head>

<body>
    <nav class="dn-breadcrumbs">
        <a href="index.html">Home</a>
        <span class="separator">/</span>
        <span class="current">Bag</span>
    </nav>

    <header class="dn-page-head">
        <h1 class="dn-page-title">Your Bag</h1>
        <p class="dn-page-sub"><span id="cart-item-count">0</span> Items</p>
    </header>

    <div class="cart-layout">
        <div class="cart-main">
            <div class="cart-items" id="cart-container"></div>
        </div>

        <aside class="order-summary" id="order-summary">
            <div class="summary-title">Order Summary</div>
            <div class="summary-row">
                <span class="summary-label">Subtotal</span>
                <span class="summary-value" id="summary-subtotal">₹0</span>
            </div>
            <div class="summary-row" id="discount-row" style="display:none;">
                <span class="summary-label">Discount</span>
                <span class="summary-value" id="summary-discount">-₹0</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Shipping</span>
                <span class="summary-value" id="summary-shipping">FREE</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Estimated Tax (18%)</span>
                <span class="summary-value" id="summary-tax">₹0</span>
            </div>
            <div class="summary-divider"></div>
            <div class="summary-row">
                <span class="summary-total-label">TOTAL</span>
                <span class="summary-total-value" id="summary-total">₹0</span>
            </div>

            <!-- Promo Code -->
            <div class="promo-section">
                <div class="promo-row" id="promo-input-row">
                    <input type="text" class="promo-input" id="promoInput" placeholder="Promo code">
                    <button class="promo-apply-btn" onclick="applyPromo()">Apply</button>
                </div>
                <div id="promo-msg"></div>
                <div id="promo-applied" class="promo-applied" style="display:none;">
                    <span class="promo-applied-label" id="promo-applied-label"></span>
                    <button class="promo-remove" onclick="removePromo()">Remove</button>
                </div>
            </div>

            <button class="checkout-btn" onclick="startCheckout()">Checkout</button>
            <a href="shop.html" class="continue-btn">Continue Shopping</a>
        </aside>
    </div>

    <!-- ═══ CHECKOUT MODAL (Phase 5.3) ═══ -->
    <div id="checkout-modal" class="co-modal-overlay">
        <div class="co-modal">
            <div class="co-modal-head">
                <span>Checkout</span>
                <button class="co-close" onclick="closeCheckout()">&times;</button>
            </div>
            <form class="co-form" onsubmit="submitCheckout(event)">
                <input id="co-name" placeholder="Full name" required autocomplete="name">
                <input id="co-email" type="email" placeholder="Email" required autocomplete="email">
                <input id="co-phone" type="tel" placeholder="Phone" required autocomplete="tel">
                <input id="co-line1" placeholder="Address" required autocomplete="address-line1">
                <div class="co-row">
                    <input id="co-city" placeholder="City" required autocomplete="address-level2">
                    <input id="co-state" placeholder="State" required autocomplete="address-level1">
                    <input id="co-pincode" placeholder="Pincode" required inputmode="numeric" autocomplete="postal-code">
                </div>
                <div id="checkout-msg" class="promo-msg"></div>
                <button type="submit" id="checkout-submit" class="checkout-btn" style="margin-top:6px;">Pay Securely</button>
            </form>
        </div>
    </div>

    <script>
        let appliedPromo = null;

        function renderCart() {
            const container = document.getElementById('cart-container');
            const items = CartEngine.getItems();
            const countEl = document.getElementById('cart-item-count');

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <p class="empty-cart-msg">Your bag is empty</p>
                        <a href="shop.html" class="continue-shopping-link">Start Shopping</a>
                    </div>
                `;
                countEl.innerText = '0';
                updateSummary(0);
                return;
            }

            const totalItems = items.reduce((s, i) => s + i.quantity, 0);
            countEl.innerText = totalItems;

            container.innerHTML = items.map(item => {
                const key = CartEngine.lineKey(item).replace(/'/g, "\\'");
                const sizeLabel = item.size ? 'Size ' + item.size : 'One size';
                return `
                <div class="cart-item">
                    <div class="cart-item-img" style="background-image: url('${item.image || ''}')"></div>
                    <div class="cart-item-details">
                        <span class="cart-item-name">${item.name}</span>
                        <span class="cart-item-meta">${sizeLabel}</span>
                        <div class="cart-item-qty-row">
                            <button class="qty-btn" onclick="changeQty('${key}', -1)">−</button>
                            <span class="qty-value">${item.quantity}</span>
                            <button class="qty-btn" onclick="changeQty('${key}', 1)">+</button>
                        </div>
                    </div>
                    <div class="cart-item-right">
                        <span class="cart-item-price">₹${(parseInt(item.price.toString().replace(/[^0-9]/g, '')) * item.quantity).toLocaleString('en-IN')}</span>
                        <button class="cart-remove-btn" onclick="removeItem('${key}')">Remove</button>
                    </div>
                </div>
                `;
            }).join('');

            updateSummary(CartEngine.getTotal());
        }

        function updateSummary(subtotal) {
            let discount = 0;
            let freeShipping = false;

            if (appliedPromo) {
                if (appliedPromo.type === 'shipping') {
                    freeShipping = true;
                } else {
                    discount = appliedPromo.discount;
                }
            }

            const afterDiscount = Math.max(0, subtotal - discount);
            const tax = Math.round(afterDiscount * 0.18);
            const baseShipping = subtotal > 0 ? (subtotal >= 2000 ? 0 : 149) : 0;
            const shipping = freeShipping ? 0 : baseShipping;
            const total = afterDiscount + tax + shipping;

            document.getElementById('summary-subtotal').innerText = `₹${subtotal.toLocaleString('en-IN')}`;
            document.getElementById('summary-shipping').innerText = shipping === 0 ? 'FREE' : `₹${shipping}`;
            document.getElementById('summary-tax').innerText = `₹${tax.toLocaleString('en-IN')}`;
            document.getElementById('summary-total').innerText = `₹${total.toLocaleString('en-IN')}`;

            const discountRow = document.getElementById('discount-row');
            if (discount > 0) {
                discountRow.style.display = 'flex';
                document.getElementById('summary-discount').innerText = `-₹${discount.toLocaleString('en-IN')}`;
            } else {
                discountRow.style.display = 'none';
            }
        }

        async function applyPromo() {
            const code = document.getElementById('promoInput').value.trim();
            const msgEl = document.getElementById('promo-msg');
            if (!code) { msgEl.innerHTML = '<span class="promo-msg error">Enter a promo code.</span>'; return; }

            const subtotal = CartEngine.getTotal();
            msgEl.innerHTML = '<span class="promo-msg">Checking…</span>';
            let result;
            try {
                result = await StoreBridge.validatePromo(code, subtotal);
            } catch (e) {
                console.error('[DripNation] promo validation failed', e);
                msgEl.innerHTML = '<span class="promo-msg error">Could not validate code. Please try again.</span>';
                return;
            }

            if (!result.valid) {
                msgEl.innerHTML = `<span class="promo-msg error">${result.message}</span>`;
                return;
            }

            appliedPromo = result;
            msgEl.innerHTML = '';
            document.getElementById('promo-input-row').style.display = 'none';
            document.getElementById('promo-applied').style.display = 'flex';
            document.getElementById('promo-applied-label').textContent = `${result.code} — ${result.label}`;
            updateSummary(subtotal);
        }

        function removePromo() {
            appliedPromo = null;
            document.getElementById('promo-input-row').style.display = 'flex';
            document.getElementById('promo-applied').style.display = 'none';
            document.getElementById('promoInput').value = '';
            document.getElementById('promo-msg').innerHTML = '';
            updateSummary(CartEngine.getTotal());
        }

        function changeQty(key, delta) { CartEngine.updateQuantity(key, delta); renderCart(); }
        function removeItem(key) { CartEngine.removeItem(key); renderCart(); }

        // ── Checkout (Phase 5.3) ──
        const val = id => document.getElementById(id).value.trim();

        function startCheckout() {
            if (CartEngine.getItems().length === 0) return;
            if (!window.DN_CONFIG || !window.DN_CONFIG.checkoutEnabled) { CartEngine.showComingSoonModal(); return; }
            document.getElementById('checkout-msg').textContent = '';
            document.getElementById('checkout-modal').classList.add('open');
        }
        function closeCheckout() { document.getElementById('checkout-modal').classList.remove('open'); }

        async function submitCheckout(e) {
            e.preventDefault();
            const btn = document.getElementById('checkout-submit');
            const msg = document.getElementById('checkout-msg');
            btn.disabled = true; msg.className = 'promo-msg'; msg.textContent = 'Creating your order…';
            const items = CartEngine.getItems().map(i => ({ product_id: i.product_id, size: i.size || '', quantity: i.quantity }));
            const customer = {
                name: val('co-name'), email: val('co-email'), phone: val('co-phone'),
                address: { line1: val('co-line1'), city: val('co-city'), state: val('co-state'), pincode: val('co-pincode') }
            };
            const payload = { items, promo_code: appliedPromo ? appliedPromo.code : null, customer };
            let res, data;
            try {
                res = await fetch(window.DN_CONFIG.supabaseUrl + '/functions/v1/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': window.DN_CONFIG.supabaseAnonKey, 'Authorization': 'Bearer ' + window.DN_CONFIG.supabaseAnonKey },
                    body: JSON.stringify(payload)
                });
                data = await res.json().catch(() => ({}));
            } catch (err) {
                msg.className = 'promo-msg error'; msg.textContent = 'Network error. Please try again.'; btn.disabled = false; return;
            }
            if (!res.ok) {
                msg.className = 'promo-msg error'; msg.textContent = (data && data.error) || 'Checkout failed. Please try again.'; btn.disabled = false; return;
            }
            msg.textContent = 'Opening secure payment…';
            await openRazorpay(data, customer);
            btn.disabled = false;
        }

        function loadRazorpay() {
            if (window.Razorpay) return Promise.resolve(true);
            return new Promise(resolve => {
                const s = document.createElement('script');
                s.src = 'https://checkout.razorpay.com/v1/checkout.js';
                s.onload = () => resolve(true); s.onerror = () => resolve(false);
                document.head.appendChild(s);
            });
        }

        async function openRazorpay(data, customer) {
            const msg = document.getElementById('checkout-msg');
            if (!(await loadRazorpay()) || !window.Razorpay) { msg.className = 'promo-msg error'; msg.textContent = 'Could not load payment.'; return; }
            const rzp = new window.Razorpay({
                key: data.key_id, order_id: data.razorpay_order_id, amount: data.amount, currency: 'INR',
                name: 'DRIP NATION', description: 'Order ' + String(data.order_id).slice(0, 8),
                prefill: { name: customer.name, email: customer.email, contact: customer.phone },
                theme: { color: '#000000' },
                handler: () => orderPlaced(data.order_id, data.lookup_token),
                modal: { ondismiss: () => { msg.className = 'promo-msg error'; msg.textContent = 'Payment cancelled.'; } }
            });
            rzp.open();
        }

        function orderPlaced(orderId, token) {
            localStorage.removeItem(CartEngine.key);
            closeCheckout();
            CartEngine.updateAllBadges();
            document.getElementById('cart-item-count').innerText = '0';
            const orderLink = token ? `order.html?id=${encodeURIComponent(orderId)}&token=${encodeURIComponent(token)}` : null;
            document.getElementById('cart-container').innerHTML = `
                <div class="empty-cart">
                    <p class="empty-cart-msg" style="color:var(--black);">Order placed</p>
                    <p style="color:var(--text-muted);letter-spacing:0.05em;margin-bottom:24px;font-size:0.8125rem;">Order ${String(orderId).slice(0, 8)} — a confirmation email is on its way.</p>
                    ${orderLink ? `<a href="${orderLink}" class="continue-shopping-link" style="margin-right:10px;">View order</a>` : ''}
                    <a href="shop.html" class="continue-shopping-link">Continue Shopping</a>
                </div>`;
            updateSummary(0);
        }

        document.addEventListener("DOMContentLoaded", renderCart);
    </script>
</body>

</html>
